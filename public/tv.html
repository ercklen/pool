<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black; /* Black background looks best on TVs */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevent scrolling */
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Ensures the whole image is visible without stretching */
        }
    </style>
</head>
<body>
    <img src="/poster.jpg" alt="Tournament Poster">
</body>
</html>
