<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .video-wrapper {
            /* 9:16 portrait aspect ratio container */
            position: relative;
            height: 100vh;
            width: calc(100vh * 9 / 16); /* Keep 9:16 ratio based on screen height */
            max-width: 100vw;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Fill container, may crop slightly */
        }
    </style>
</head>
<body>
    <div class="video-wrapper">
        <!--
            Place your video file in the /public folder (e.g. /public/video.mp4)
            then update the src below to match the filename.
        -->
        <video
            src="/1.mp4"
            autoplay
            loop
            muted
            playsinline
        ></video>
    </div>
</body>
</html>
